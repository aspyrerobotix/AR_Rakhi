<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Rakhi</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; }
  #video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #gl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
  body.mirrored #video, body.mirrored #gl { transform: scaleX(-1); }

  /* ---------- Welcome screen ---------- */
  #welcomeScreen {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
    background: linear-gradient(180deg, rgba(20,10,10,.88), rgba(5,2,2,.94));
    color: #fff;
  }
  #heroImage {
    width: 148px; height: 148px; border-radius: 50%; object-fit: cover;
    border: 3px solid #ff7a00; box-shadow: 0 4px 20px rgba(0,0,0,.45);
  }
  #heroCaption { font-size: 19px; font-weight: 800; color: #ffd54a; margin: 0; }
  #welcomeTitle { font-size: 24px; font-weight: 700; margin: 0; }
  #welcomeText { font-size: 16px; line-height: 1.5; opacity: .92; max-width: 360px; margin: 0; }
  .bigChoiceBtn {
    width: 100%; max-width: 340px; padding: 18px 20px; border-radius: 18px; border: none;
    font-size: 17px; font-weight: 600; color: #fff; background: rgba(255,255,255,.14);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .bigChoiceBtn.primary { background: #ff7a00; }
  .bigChoiceBtn:disabled { opacity: .55; }
  #welcomeChoices { display: flex; flex-direction: column; gap: 14px; width: 100%; align-items: center; margin-top: 6px; }

  /* ---------- Instruction card ---------- */
  /* Wide, short card: fewer wrapped lines beats a narrow card with lots of
     unused space on either side of it. */
  #instructionCard {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    width: min(94vw, 640px); z-index: 15;
    background: rgba(20, 10, 10, .78); color: #fff;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 9px 16px;
    font-size: 14px; line-height: 1.35; text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
    display: none;
  }
  #instructionCard.show { display: block; }

  /* ---------- Bottom controls ---------- */
  /* Labeled buttons (not icon-only — labels matter more than a couple of
     rows of vertical space), just sized down and allowed to wrap so they
     still fit narrow phones without spilling too wide. */
  #controls {
    position: fixed; bottom: 14px; left: 0; width: 100%;
    display: none; flex-direction: column; align-items: center; gap: 8px; z-index: 20;
    padding: 0 12px; box-sizing: border-box;
  }
  #controls .row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #controls .primaryRow { gap: 12px; }

  /* :not() exclusions here so this generic rule can't out-specificity the
     Photo/Record color rules below (an ID+class+element selector otherwise
     beats a lone ID selector, which silently overrode their backgrounds). */
  #controls .row button:not(#captureBtn):not(#recordBtn) {
    padding: 9px 13px; border-radius: 18px; border: none; min-height: 40px;
    background: rgba(255,255,255,.18); color: #fff; font-size: 12.5px; font-weight: 500;
  }
  #controls .row button:disabled { opacity: .55; }
  #replayBtn { display: none; }

  #captureBtn, #recordBtn {
    padding: 13px 34px; border-radius: 24px; border: none; min-height: 48px; min-width: 132px;
    font-size: 16px; font-weight: 700;
  }
  #captureBtn { background: #f2c230; color: #2a1600; }
  #recordBtn { background: #d81e2c; color: #fff; }
  #recordBtn.recording { background: #7a0f16; }
  #recordBtn:disabled { opacity: .55; }

  /* ---------- Tap feedback ---------- */
  /* Every button gets a visible press state — without this, taps can feel
     like they didn't register, especially before any state text updates. */
  button {
    -webkit-tap-highlight-color: rgba(255,255,255,.25);
    transition: transform 90ms ease, filter 90ms ease;
  }
  button:active:not(:disabled) { transform: scale(0.94); filter: brightness(0.85); }

  #flash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #fff; opacity: 0; pointer-events: none;
    transition: opacity 120ms ease-out; z-index: 30;
  }

  /* ---------- Celebration overlay ---------- */
  /* Anchored just above the controls (not centered on the video) so it never
     covers the face; single-line, shrink-to-fit banner instead of large
     free-floating text that can wrap. */
  #celebrate {
    position: fixed; bottom: 150px; left: 50%;
    transform: translateX(-50%) scale(.85);
    z-index: 35; pointer-events: none;
    opacity: 0; transition: opacity 300ms ease, transform 300ms ease;
  }
  #celebrate.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #celebrate .msg {
    display: inline-block; white-space: nowrap;
    font-size: clamp(15px, 5vw, 21px); font-weight: 800; color: #fff;
    padding: 9px 18px; border-radius: 20px;
    background: linear-gradient(90deg, rgba(216,30,44,.88), rgba(242,150,30,.88));
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="gl"></canvas>
<div id="flash"></div>

<div id="celebrate"><div class="msg">🎉 Happy Rakhi! 🎉</div></div>

<div id="instructionCard"><span id="instructionText"></span></div>

<div id="welcomeScreen">
  <img id="heroImage" src="images/hero.jpeg" alt="">
  <p id="heroCaption">🎉 Happy Rakhi from Sridevi! 🎉</p>
  <h1 id="welcomeTitle">🪢 AR Rakhi</h1>
  <p id="welcomeText">Welcome! This app ties a virtual Rakhi onto your wrist using your camera — like magic, no thread needed. Choose how you'd like to begin:</p>
  <div id="welcomeChoices">
    <button id="startBackBtn" class="bigChoiceBtn primary">📷 Show My Wrist (Back Camera)</button>
    <button id="startSelfieBtn" class="bigChoiceBtn">🤳 Selfie Mode (Front Camera)</button>
  </div>
</div>

<div id="controls">
  <div class="row">
    <button id="switchCameraBtn">🔄 Switch Camera</button>
    <button id="replayBtn">🔊 Replay Message</button>
  </div>
  <div class="row primaryRow">
    <button id="captureBtn">📸 Photo</button>
    <button id="recordBtn">🎥 Record</button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
